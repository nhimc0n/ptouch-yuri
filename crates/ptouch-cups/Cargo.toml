[package]
name = "ptouch-cups"
description = "CUPS raster filter that prints labels on the Brother PT-E850TKW"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
