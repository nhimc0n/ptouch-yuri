<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>PT-E850TKW</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main class="page" id="page">
      <header class="head">
        <div class="head-text">
          <h1 data-i18n="head.title"></h1>
          <p data-i18n="head.sub"></p>
        </div>
        <div class="lang" role="group" data-i18n-aria="lang.label" id="lang">
          <button type="button" data-lang="vi" title="Tiếng Việt">VI</button>
          <button type="button" data-lang="en" title="English">EN</button>
        </div>
      </header>

      <section class="card status" id="status" aria-live="polite"></section>
      <div class="alerts" id="alerts"></div>

      <div id="form">
        <section class="card" aria-labelledby="h-cut">
          <h2 id="h-cut" data-i18n="cut.h"></h2>
          <div class="rows">
            <label class="row">
              <input type="checkbox" id="half_cut" />
              <span class="row-text">
                <span class="row-title" data-i18n="half.title"></span>
                <span class="row-desc" data-i18n="half.desc"></span>
              </span>
            </label>
            <label class="row">
              <input type="checkbox" id="full_cut" />
              <span class="row-text">
                <span class="row-title" data-i18n="full.title"></span>
                <span class="row-desc" data-i18n="full.desc"></span>
              </span>
            </label>
          </div>
          <p class="note" data-i18n="cut.note"></p>
        </section>

        <section class="card" aria-labelledby="h-mode">
          <h2 id="h-mode" data-i18n="mode.h"></h2>
          <div class="rows">
            <label class="row">
              <input type="checkbox" id="mirror" />
              <span class="row-text">
                <span class="row-title" data-i18n="mirror.title"></span>
                <span class="row-desc" data-i18n="mirror.desc"></span>
              </span>
            </label>
            <label class="row is-locked">
              <input type="checkbox" id="chain" disabled />
              <span class="row-text">
                <span class="row-title"><span data-i18n="chain.title"></span> <span class="tag"><svg class="icon" data-i="lock"></svg><span data-i18n="chain.tag"></span></span></span>
                <span class="row-desc" data-i18n="chain.desc"></span>
              </span>
            </label>
          </div>
        </section>

        <section class="card" aria-labelledby="h-quality">
          <h2 id="h-quality" data-i18n="quality.h"></h2>
          <fieldset class="choices" id="quality"></fieldset>
        </section>

        <section class="card" aria-labelledby="h-size">
          <h2 id="h-size" data-i18n="size.h"></h2>
          <p class="hint" data-i18n="size.hint"></p>
          <div class="select" id="size"></div>
        </section>
      </div>

      <section class="card" id="conn" aria-labelledby="h-conn">
        <h2 id="h-conn" data-i18n="conn.h"></h2>
        <label class="field" for="host" data-i18n="conn.label"></label>
        <div class="field-row">
          <input class="input" id="host" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.99.107" />
          <button class="btn btn-outline" id="save-host" type="button" data-i18n="conn.save"></button>
        </div>
        <p class="hint" data-i18n="conn.hint"></p>
        <div class="actions">
          <button class="btn btn-outline" type="button" disabled><svg class="icon" data-i="printer"></svg><span data-i18n="conn.test"></span></button>
          <button class="btn btn-outline" type="button" disabled><svg class="icon" data-i="refresh"></svg><span data-i18n="conn.reinstall"></span></button>
          <span class="soon" data-i18n="conn.soon"></span>
        </div>
      </section>
    </main>

    <footer class="bar" id="bar">
      <p class="bar-text" id="bar-text" role="status"></p>
      <div class="bar-actions">
        <button class="btn btn-outline" id="reset" type="button" data-i18n="bar.reset"></button>
        <button class="btn btn-primary" id="apply" type="button" data-i18n="bar.apply"></button>
      </div>
    </footer>
  </div>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
