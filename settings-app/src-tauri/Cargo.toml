[package]
name = "ptouch-settings-app"
description = "Driver settings app for the Brother PT-E850TKW on macOS"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Its own workspace: Tauri is a large dependency and must not slow down
# `cargo test --workspace` for the printer crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ptouch-settings = { path = "../../crates/ptouch-settings" }
