[package]
name = "ptouch-settings-app"
description = "Driver settings app for the Brother PT-E850TKW on macOS"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Its own workspace: Tauri is a large dependency and must not slow down
# `cargo test --workspace` for the printer crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ptouch-settings = { path = "../../crates/ptouch-settings" }

# On macOS 27 the linker writes optimised proc-macro dylibs that dlopen rejects
# ("mis-aligned LINKEDIT string pool"), so a release build fails with E0463.
# Build the proc-macros and build scripts unoptimised; the app itself is unchanged.
[profile.release.build-override]
opt-level = 0
